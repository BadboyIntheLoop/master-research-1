[project]
name = "qvenv"
version = "0.1.0"
description = "Qiskit-related packages for learning Quantum Computing"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "qiskit>=2.1",
    "qiskit-aer>=0.17",
    "matplotlib>=3.9",
    "pylatexenc>=2.10",
    "sympy>=1.13",
]

[dependency-groups]
# Cai bang: uv sync --group notebook
notebook = [
    "jupyterlab>=4.2",
    "ipykernel>=6.29",
]
